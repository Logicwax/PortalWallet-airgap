---

- name: Disable services
  action: systemd name={{item}} enabled=no masked=yes
  with_items:
    - ssh

- name: Remove build dependencies
  apt:
    state: absent
    pkg:
    - build-essential
    - autoconf
    - automake
    - libtool
    - libc6-dbg

# Node.js + npm + yarn are only used to package the Electron app at build time
# (see the `portalwallet` role). The packaged binary in /opt/portalwallet is self-contained,
# so strip the toolchain and its source/cache from the shipped image.
- name: Remove Node.js build toolchain
  block:
    - apt:
        state: absent
        purge: yes
        pkg:
        - nodejs
        - node-corepack
    # corepack writes its yarn/pnpm shims next to the node binary (/usr/bin);
    # these aren't dpkg-tracked, so remove them explicitly.
    - file:
        state: absent
        path: "{{ item }}"
      with_items:
        - /usr/bin/yarn
        - /usr/bin/yarnpkg
        - /usr/bin/pnpm
        - /usr/bin/pnpx
        - /tmp/portalwallet-app
        - /home/portaluser/.yarn
        - /home/portaluser/.npm
        - /home/portaluser/.cache/node
        - /root/.cache/node

- name: Cleanup Cruft files
  action: file state=absent path={{item}}
  with_items:
    - "/var/cache/apt/"
    - "/var/cache/debconf/"
    - "/var/lib/mysql/"
    - "/var/lib/apt/"
    - "/var/log/"
    - "/usr/share/doc/"
    - "/usr/share/icons/"
    - "/home/portaluser/.cache/"
    - "/home/portaluser/.ansible"

- file:
    path: /home/portaluser
    recurse: true
    state: directory
    owner: portaluser
    group: portaluser
    mode: "0700"

- name: Trim Filesystem
  shell: fstrim -av
